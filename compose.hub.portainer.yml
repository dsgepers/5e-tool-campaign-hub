# Standalone OAuth Campaign Hub with Cloudflare Tunnel for Portainer.
# Portainer: Environment variables -> Load variables from .env file -> .env.hub.
# Uploading this Compose file does not import the separate environment file.
# No host checkout, prebuilt app images or HUB_PROJECT_DIR is required.
# config-init writes the Caddy/PostgreSQL files into the managed hub-project volume.
# Compose builds app images from the public Git context before starting services.
# Existing named data volumes retain their names; stop the old stack before handover.
# Target Docker Standalone (not Swarm). Setup: docs/hub/portainer.md.
name: thelemartools-hub
x-hub-bff: &hub-bff
  image: ${HUB_BFF_IMAGE:-thelemartools-hub-bff:latest}
  pull_policy: build
  build:
    context: ${HUB_BUILD_CONTEXT:-https://github.com/dsgepers/5e-tool-campaign-hub.git#multiplayer-hub}
    dockerfile: server/Dockerfile
    args:
      NPM_REGISTRY: ${HUB_NPM_REGISTRY:-https://registry.npmjs.org/}
      VERSION: ${HUB_IMAGE_VERSION:-dev}
      VCS_REF: ${HUB_VCS_REF:-unknown}
services:
  config-init:
    image: caddy:2.8.4-alpine
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        set -eu
        umask 022
        cat > /config/.Caddyfile.tmp <<'HUB_CADDY_CONFIG'
        {
          servers {
            trusted_proxies static {$$HUB_TUNNEL_CONNECTOR_IP}
            client_ip_headers CF-Connecting-IP
          }
        }

        (hub_backend) {
          reverse_proxy bff:5052 {
            header_up X-Forwarded-For {client_ip}
            header_up X-Forwarded-Proto https
          }
        }

        # Public TLS terminates at Cloudflare. This listener has no published host port.
        http://{$$HUB_PUBLIC_DOMAIN}:8080 {
          # route preserves this order: reject other peers before any proxy handler.
          route {
            @outsideTunnel not remote_ip {$$HUB_TUNNEL_CONNECTOR_IP}
            respond @outsideTunnel 403
            encode zstd gzip

            handle /api/* {
              import hub_backend
            }

            handle /auth/* {
              import hub_backend
            }

            handle /ws/* {
              import hub_backend
            }

            handle {
              header Cache-Control "public, max-age=0, must-revalidate"
              reverse_proxy static:80
            }
          }
        }
        HUB_CADDY_CONFIG
        mv /config/.Caddyfile.tmp /config/Caddyfile
        cat > /config/.10-hub-roles.sh.tmp <<'HUB_DB_INIT'
        #!/bin/sh
        set -eu

        : "$${POSTGRES_USER:?POSTGRES_USER is required}"
        : "$${POSTGRES_DB:?POSTGRES_DB is required}"
        : "$${HUB_RUNTIME_DB_PASSWORD:?HUB_RUNTIME_DB_PASSWORD is required}"
        : "$${HUB_BACKUP_DB_PASSWORD:?HUB_BACKUP_DB_PASSWORD is required}"
        : "$${HUB_OPERATIONS_DB_PASSWORD:?HUB_OPERATIONS_DB_PASSWORD is required}"

        psql \
          --username "$$POSTGRES_USER" \
          --dbname "$$POSTGRES_DB" \
          --set ON_ERROR_STOP=1 \
          --set runtime_password="$$HUB_RUNTIME_DB_PASSWORD" \
          --set backup_password="$$HUB_BACKUP_DB_PASSWORD" \
          --set operations_password="$$HUB_OPERATIONS_DB_PASSWORD" <<'SQL'
        CREATE ROLE hub_runtime LOGIN PASSWORD :'runtime_password';
        CREATE ROLE hub_backup LOGIN PASSWORD :'backup_password';
        CREATE ROLE hub_operations LOGIN PASSWORD :'operations_password';
        SQL
        HUB_DB_INIT
        chmod 0644 /config/.10-hub-roles.sh.tmp
        mv /config/.10-hub-roles.sh.tmp /config/10-hub-roles.sh
    network_mode: none
    restart: 'no'
    volumes:
      - type: volume
        source: hub-project
        target: /config
        volume:
          nocopy: true
  db:
    image: postgres:17.6-bookworm
    environment:
      HUB_BACKUP_DB_PASSWORD: ${HUB_BACKUP_DB_PASSWORD:?Set HUB_BACKUP_DB_PASSWORD}
      HUB_OPERATIONS_DB_PASSWORD: ${HUB_OPERATIONS_DB_PASSWORD:?Set HUB_OPERATIONS_DB_PASSWORD}
      HUB_RUNTIME_DB_PASSWORD: ${HUB_RUNTIME_DB_PASSWORD:?Set HUB_RUNTIME_DB_PASSWORD}
      POSTGRES_DB: hub
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:?Set HUB_POSTGRES_PASSWORD}
      POSTGRES_USER: hub_owner
    healthcheck:
      interval: 5s
      retries: 20
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U hub_owner -d hub
      timeout: 5s
    networks:
      hub-private: {}
    restart: unless-stopped
    volumes:
      - source: hub-postgres
        target: /var/lib/postgresql/data
        type: volume
      - type: volume
        source: hub-project
        target: /docker-entrypoint-initdb.d
        read_only: true
        volume:
          nocopy: true
    depends_on:
      config-init:
        condition: service_completed_successfully
  migrate:
    <<: *hub-bff
    command:
      - node
      - server/scripts/migrate.mjs
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hub_owner:${HUB_POSTGRES_PASSWORD}@db:5432/hub
      HUB_DATABASE_SSL: 'false'
    networks:
      hub-private: {}
    restart: 'no'
  grant-roles:
    <<: *hub-bff
    command:
      - node
      - server/scripts/grant-roles.mjs
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://hub_owner:${HUB_POSTGRES_PASSWORD}@db:5432/hub
      HUB_BACKUP_DB_PASSWORD: ${HUB_BACKUP_DB_PASSWORD:?Set HUB_BACKUP_DB_PASSWORD}
      HUB_BACKUP_DB_ROLE: hub_backup
      HUB_DATABASE_SSL: 'false'
      HUB_OPERATIONS_DB_PASSWORD: ${HUB_OPERATIONS_DB_PASSWORD:?Set HUB_OPERATIONS_DB_PASSWORD}
      HUB_OPERATIONS_DB_ROLE: hub_operations
      HUB_RUNTIME_DB_PASSWORD: ${HUB_RUNTIME_DB_PASSWORD:?Set HUB_RUNTIME_DB_PASSWORD}
      HUB_RUNTIME_DB_ROLE: hub_runtime
    networks:
      hub-private: {}
    restart: 'no'
  bff:
    <<: *hub-bff
    depends_on:
      grant-roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://hub_runtime:${HUB_RUNTIME_DB_PASSWORD}@db:5432/hub
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      HUB_ACCOUNT_ENTITLEMENTS_ENABLED: ${HUB_ACCOUNT_ENTITLEMENTS_ENABLED:-false}
      HUB_ACCOUNT_IDENTITY_LINKING_ENABLED: ${HUB_ACCOUNT_IDENTITY_LINKING_ENABLED:-true}
      HUB_ALLOWED_OAUTH_SUBJECTS: ${HUB_ALLOWED_OAUTH_SUBJECTS:-}
      HUB_APP_ORIGIN: https://${HUB_PUBLIC_DOMAIN:?Set HUB_PUBLIC_DOMAIN to your tunnel hostname}
      HUB_AUTH_EMERGENCY_DISABLED_PROVIDERS: ${HUB_AUTH_EMERGENCY_DISABLED_PROVIDERS:-}
      HUB_AUTH_PROVIDERS: ${HUB_AUTH_PROVIDERS:-github}
      HUB_COOKIE_SECRET: ${HUB_COOKIE_SECRET:?Import .env.hub in Portainer Environment variables - HUB_COOKIE_SECRET is missing}
      HUB_CSRF_SECRET: ${HUB_CSRF_SECRET:?Set HUB_CSRF_SECRET}
      HUB_DATABASE_SSL: 'false'
      HUB_HOST: 0.0.0.0
      HUB_IDENTITY_RETENTION_REQUIRED_PROVIDERS: ${HUB_IDENTITY_RETENTION_REQUIRED_PROVIDERS:-github}
      HUB_INVITE_ACCOUNT_ADMISSION_ENABLED: ${HUB_INVITE_ACCOUNT_ADMISSION_ENABLED:-false}
      HUB_INVITE_TOKEN_PREVIOUS_SECRETS: ${HUB_INVITE_TOKEN_PREVIOUS_SECRETS:-}
      HUB_INVITE_TOKEN_SECRET: ${HUB_INVITE_TOKEN_SECRET:?Set HUB_INVITE_TOKEN_SECRET}
      HUB_LOG_LEVEL: ${HUB_LOG_LEVEL:-info}
      HUB_METRICS_TOKEN: ${HUB_METRICS_TOKEN:?Set HUB_METRICS_TOKEN}
      HUB_MULTI_TARGET_OPERATIONS_CAMPAIGN_IDS: ${HUB_MULTI_TARGET_OPERATIONS_CAMPAIGN_IDS:-}
      HUB_OPERATOR_ACCOUNT_IDS: ${HUB_OPERATOR_ACCOUNT_IDS:-}
      HUB_PEER_SOURCE_COSTS_CAMPAIGN_IDS: ${HUB_PEER_SOURCE_COSTS_CAMPAIGN_IDS:-}
      HUB_PORT: '5052'
      HUB_TRUST_PROXY: ${HUB_TRUST_PROXY:-172.30.0.10}
      HUB_AUTH_MODE: oauth
    networks:
      hub-egress: {}
      hub-private: {}
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=16m,mode=1777
  static:
    image: ${HUB_STATIC_IMAGE:-thelemartools-hub-static:latest}
    pull_policy: build
    build:
      context: ${HUB_BUILD_CONTEXT:-https://github.com/dsgepers/5e-tool-campaign-hub.git#multiplayer-hub}
      dockerfile: deploy/hub/static.Dockerfile
      args:
        NPM_REGISTRY: ${HUB_NPM_REGISTRY:-https://registry.npmjs.org/}
    networks:
      hub-private: {}
    restart: unless-stopped
  edge:
    image: caddy:2.8.4-alpine
    depends_on:
      bff:
        condition: service_healthy
      static:
        condition: service_started
      config-init:
        condition: service_completed_successfully
    environment:
      HUB_PUBLIC_DOMAIN: ${HUB_PUBLIC_DOMAIN:?Set HUB_PUBLIC_DOMAIN to your tunnel hostname}
      HUB_TUNNEL_CONNECTOR_IP: ${HUB_TUNNEL_CONNECTOR_IP:-172.31.0.10}
    networks:
      hub-private:
        ipv4_address: ${HUB_EDGE_PRIVATE_IP:-172.30.0.10}
      hub-public: {}
      tunnel-net: {}
    ports: []
    restart: unless-stopped
    volumes:
      - type: volume
        source: hub-project
        target: /etc/caddy
        read_only: true
        volume:
          nocopy: true
      - source: hub-caddy-data
        target: /data
        type: volume
      - source: hub-caddy-config
        target: /config
        type: volume
  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
    container_name: 5etools-cloudflared
    depends_on:
      edge:
        condition: service_started
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:?Set CLOUDFLARED_TOKEN in .env.hub}
    networks:
      tunnel-net:
        ipv4_address: ${HUB_TUNNEL_CONNECTOR_IP:-172.31.0.10}
    restart: unless-stopped
  maintenance:
    <<: *hub-bff
    command:
      - node
      - server/scripts/maintenance.mjs
    depends_on:
      grant-roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://hub_runtime:${HUB_RUNTIME_DB_PASSWORD}@db:5432/hub
      HUB_DATABASE_SSL: 'false'
      HUB_MAINTENANCE_BATCH_SIZE: ${HUB_MAINTENANCE_BATCH_SIZE:-1000}
    networks:
      hub-private: {}
    profiles:
      - maintenance
    restart: 'no'
  backup:
    image: ${HUB_OPS_IMAGE:-thelemartools-hub-ops:latest}
    pull_policy: build
    build:
      context: ${HUB_BUILD_CONTEXT:-https://github.com/dsgepers/5e-tool-campaign-hub.git#multiplayer-hub}
      dockerfile: server/ops.Dockerfile
      args:
        VERSION: ${HUB_IMAGE_VERSION:-dev}
        VCS_REF: ${HUB_VCS_REF:-unknown}
    command:
      - sh
      - -ec
      - node server/scripts/backup-encrypted.mjs "/backups/hub-$$(date -u +%Y%m%dT%H%M%SZ).dump.enc"
    depends_on:
      grant-roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://hub_backup:${HUB_BACKUP_DB_PASSWORD}@db:5432/hub
      HUB_BACKUP_ENCRYPTION_KEY: ${HUB_BACKUP_ENCRYPTION_KEY:?Set HUB_BACKUP_ENCRYPTION_KEY}
      HUB_OPERATIONS_DATABASE_URL: postgresql://hub_operations:${HUB_OPERATIONS_DB_PASSWORD}@db:5432/hub
    networks:
      hub-private: {}
    profiles:
      - backup
    restart: 'no'
    volumes:
      - source: hub-backups
        target: /backups
        type: volume
volumes:
  hub-backups:
    name: ${HUB_VOLUME_PREFIX:-thelemartools-hub}_hub-backups
  hub-caddy-config:
    name: ${HUB_VOLUME_PREFIX:-thelemartools-hub}_hub-caddy-config
  hub-caddy-data:
    name: ${HUB_VOLUME_PREFIX:-thelemartools-hub}_hub-caddy-data
  hub-postgres:
    name: ${HUB_VOLUME_PREFIX:-thelemartools-hub}_hub-postgres
  hub-project:
    name: ${HUB_VOLUME_PREFIX:-thelemartools-hub}_hub-project
networks:
  hub-egress: {}
  hub-private:
    internal: true
    ipam:
      config:
        - subnet: ${HUB_PRIVATE_SUBNET:-172.30.0.0/24}
  hub-public: {}
  tunnel-net:
    ipam:
      config:
        - subnet: ${HUB_TUNNEL_SUBNET:-172.31.0.0/24}
